<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جامعة الأقصر الابتكارية | Innovative Luxor University</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#202890;--navy:#0d1244;--lb:#e7eafb;--bg:#f5f6fb;--card:#fff;--tx:#161a3a;--mu:#5b6086;--bd:#d9dcef;--ok:#17703f;--okb:#dff3e6;--no:#a3262a;--nob:#fbe3e3;--wa:#8a5a00;--wab:#fff0cc;--nw:#202890;--nwb:#e7eafb;--inv:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media all{:root[data-theme=dark]{--p:#8f97ff;--navy:#0a0d2e;--lb:#1a2058;--bg:#0c0f2a;--card:#141842;--tx:#eceefc;--mu:#a3a8d6;--bd:#2b3170;--okb:#12382a;--ok:#7fdca5;--nob:#432024;--no:#ff9fa2;--wab:#41330f;--wa:#ffd67a;--nwb:#1a2058;--nw:#b4baff;--inv:#0c0f2a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:Almarai,Tahoma,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;font-size:16px}
a{color:var(--p)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #6f78ff;outline-offset:2px}
header.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:14px;padding:10px 24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;color:#fff;cursor:pointer;padding:0;text-align:start}
.brand img{height:52px;background:#fff;border-radius:26px 26px 6px 6px;padding:3px}
.brand b{font-size:15px;display:block;line-height:1.2}.brand small{opacity:.75;font-size:12px}
.sp{flex:1}
.pubnav{display:flex;gap:4px;flex-wrap:wrap}
.pubnav button{background:none;border:0;color:#dfe2ff;padding:8px 12px;cursor:pointer;border-radius:4px}
.pubnav button:hover,.pubnav button.on{background:rgba(255,255,255,.12);color:#fff}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctl select,.ctl button{background:#1a2160;border:1px solid #3a43a8;color:#fff;border-radius:4px;padding:6px 10px;cursor:pointer}
.proto{background:var(--wab);color:var(--wa);font-size:13px;text-align:center;padding:6px 12px}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:70vh}
aside.side{background:var(--card);border-inline-end:1px solid var(--bd);padding:18px 10px}
aside.side h4{margin:0 10px 10px;color:var(--mu);font-size:13px;font-weight:700}
aside.side button{display:block;width:100%;text-align:start;background:none;border:0;padding:10px 12px;border-radius:4px;cursor:pointer;border-inline-start:3px solid transparent}
aside.side button.on{background:var(--lb);border-inline-start-color:var(--p);font-weight:700;color:var(--p)}
main{padding:28px;max-width:1240px;width:100%;margin:auto}
h1{font-size:30px;line-height:1.3;margin:0 0 6px;color:var(--navy)}h2{font-size:22px;margin:28px 0 12px}h3{font-size:17px;margin:0 0 6px}
:root[data-theme=dark] h1{color:#fff}
.mu{color:var(--mu)}.sm{font-size:14px}
.btn{background:var(--p);color:#fff;border:1px solid var(--p);padding:10px 18px;border-radius:4px;cursor:pointer;font-weight:700}
:root[data-theme=dark] .btn:not(.o):not(.g){color:#0c0f2a}.btn.o{color:var(--p)}.btn.g{color:var(--no)}
.btn:hover{filter:brightness(1.12)}.btn.o{background:transparent;color:var(--p)}.btn.g{background:var(--nob);border-color:var(--no);color:var(--no)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:8px}
.card.arch{border-radius:60px 60px 6px 6px;padding-top:30px}
.pill{display:inline-block;background:var(--lb);color:var(--p);padding:2px 10px;border-radius:20px;font-size:13px;width:fit-content}
.badge{display:inline-block;padding:2px 10px;border-radius:4px;font-size:13px;font-weight:700;width:fit-content}
.s0{background:var(--nwb);color:var(--nw)}.s1{background:var(--wab);color:var(--wa)}.s2{background:var(--okb);color:var(--ok)}.s3{background:var(--nob);color:var(--no)}
.hero{background:var(--navy);color:#fff;display:grid;grid-template-columns:1.4fr 1fr;gap:30px;align-items:center;padding:56px 40px}
.hero h1{color:#fff;font-size:42px}.hero p{color:#cfd3f7;max-width:560px}
.hero .arch{background:#fff;border-radius:200px 200px 10px 10px;padding:34px 30px 24px;text-align:center;max-width:300px;justify-self:center}
.hero .arch img{width:100%}
.hero .btn.o{color:#fff;border-color:#8f97ff}
.wave{height:6px;background:repeating-linear-gradient(90deg,var(--p) 0 24px,transparent 24px 36px)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;border-block:1px solid var(--bd)}
.steps div{padding:20px;border-inline-end:1px solid var(--bd)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:4px;padding:9px 12px;width:100%}
.filters input{flex:1;min-width:200px;width:auto}.filters select{width:auto;min-width:160px}
label{font-weight:700;font-size:14px;display:block;margin-bottom:4px}
.f{margin-bottom:16px}.err input,.err select,.err textarea{border-color:var(--no)}.em{color:var(--no);font-size:13px;margin-top:3px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:22px}
.form .w{grid-column:1/-1}
.priv{border-inline-start:4px solid var(--no);background:var(--card);padding:14px 18px;border-radius:4px;border-block:1px solid var(--bd);border-inline-end:1px solid var(--bd)}
.pub{border-inline-start:4px solid var(--ok);background:var(--card);padding:14px 18px;border-radius:4px;border-block:1px solid var(--bd);border-inline-end:1px solid var(--bd)}
.tag{font-weight:700;font-size:13px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:560px}th,td{padding:11px 14px;text-align:start;border-bottom:1px solid var(--bd);font-size:15px}th{background:var(--lb);color:var(--p)}
tr:last-child td{border:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:16px 0}
.stats div{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:14px}.stats b{font-size:28px;display:block;color:var(--p)}
.prog{display:flex;gap:6px;margin:10px 0}.prog i{flex:1;height:6px;background:var(--bd);border-radius:3px}.prog i.on{background:var(--p)}
.empty{text-align:center;padding:40px;border:1px dashed var(--bd);border-radius:6px;color:var(--mu)}
.toast{position:fixed;inset-block-end:20px;inset-inline-start:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:6px;z-index:30;box-shadow:0 4px 18px #0004}
.mask{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:25;padding:16px}
.dlg{background:var(--card);border-radius:8px;padding:24px;max-width:460px;width:100%}
.spin{width:22px;height:22px;border:3px solid var(--bd);border-top-color:var(--p);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
footer{background:var(--navy);color:#cfd3f7;padding:28px 24px;margin-top:40px;font-size:14px}
.ok{background:var(--okb);color:var(--ok);padding:14px;border-radius:6px;margin-bottom:14px}
.file{display:inline-block;background:var(--lb);color:var(--p);border-radius:4px;padding:3px 10px;margin:3px;font-size:13px}
@media(max-width:900px){.shell{grid-template-columns:1fr}aside.side{display:flex;overflow-x:auto;gap:4px;padding:8px;border-inline-end:0;border-block-end:1px solid var(--bd)}aside.side h4{display:none}aside.side button{width:auto;white-space:nowrap;border-inline-start:0;border-block-end:3px solid transparent}aside.side button.on{border-block-end-color:var(--p)}.hero{grid-template-columns:1fr;padding:32px 20px}.hero h1{font-size:30px}.form,.two{grid-template-columns:1fr}main{padding:18px}}

/* motion + polish */
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(143,151,255,.0),0 14px 40px rgba(0,0,0,.35)}50%{box-shadow:0 0 0 14px rgba(143,151,255,.12),0 18px 50px rgba(32,40,144,.55)}}
@keyframes drift{0%{background-position:0 0}100%{background-position:60px 0}}
@keyframes orb{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-24px) scale(1.15)}}
@keyframes slideT{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.brand img{height:56px;width:auto;background:none;border-radius:0;padding:0;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.brand:hover img{transform:scale(1.1) rotate(-3deg)}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;margin-inline-end:6px;flex:none}
.pubnav button,.btn,.ctl button,.card,aside.side button,.stats div,.steps div{transition:transform .25s,box-shadow .25s,background-color .25s,color .25s,border-color .25s,filter .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(32,40,144,.3)}.btn:active{transform:scale(.96)}
.pubnav button:hover{transform:translateY(-1px)}
aside.side button:hover{background:var(--lb);transform:translateX(3px)}[dir=rtl] aside.side button:hover{transform:translateX(-3px)}
.card:hover{transform:translateY(-6px);box-shadow:0 14px 30px rgba(32,40,144,.18);border-color:var(--p)}
.stats div:hover,.steps div:hover{transform:translateY(-3px);background:var(--lb)}
.hero{position:relative;overflow:hidden;isolation:isolate}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;z-index:-1;filter:blur(50px);animation:orb 9s ease-in-out infinite}
.hero::before{width:320px;height:320px;background:#3a43d8;opacity:.45;inset-block-start:-90px;inset-inline-start:-60px}
.hero::after{width:260px;height:260px;background:#c9a24a;opacity:.25;inset-block-end:-80px;inset-inline-end:30%;animation-delay:-4s}
.hero .arch{position:relative;overflow:hidden;animation:floaty 5s ease-in-out infinite,glow 4s ease-in-out infinite}
.hero .arch::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(143,151,255,.35) 50%,transparent 65%);transform:translateX(-120%);animation:shine 5s ease-in-out infinite}
@keyframes shine{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.hero .arch{background:none;padding:0;width:fit-content;max-width:none;border-radius:112px 112px 12px 12px}.hero .arch img{width:auto;height:min(400px,60vw);max-width:100%;display:block}
.wave{display:none}
#root.nav main,#root.nav .hero>div,#root.nav .steps div,#root.nav .stats div,#root.nav .form,#root.nav .pub,#root.nav .priv,#root.nav .tw,#root.nav .empty{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
#root.nav .grid>.card{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
#root.nav .grid>.card:nth-child(2),#root.nav .steps div:nth-child(2),#root.nav .stats div:nth-child(2){animation-delay:.07s}
#root.nav .grid>.card:nth-child(3),#root.nav .steps div:nth-child(3),#root.nav .stats div:nth-child(3){animation-delay:.14s}
#root.nav .grid>.card:nth-child(4),#root.nav .steps div:nth-child(4),#root.nav .stats div:nth-child(4){animation-delay:.21s}
#root.nav .grid>.card:nth-child(5){animation-delay:.28s}#root.nav .grid>.card:nth-child(6){animation-delay:.35s}#root.nav .grid>.card:nth-child(n+7){animation-delay:.42s}
.dlg{animation:pop .3s cubic-bezier(.3,1.5,.5,1)}.mask{animation:rise .25s both}
.toast{animation:slideT .35s both}
.badge,.pill{display:inline-flex;align-items:center}
.lockbox{display:flex;gap:10px;align-items:center;background:var(--lb);color:var(--p);border-radius:6px;padding:12px 16px;margin-top:16px}
.lockbox svg{width:22px;height:22px;flex:none}
.dl.pubdl b{color:var(--ok)}

body,header.top,aside.side,.form,.pub,.priv,.tw,.dlg,input,select,textarea,footer,.shell{transition:background-color .4s,color .4s,border-color .4s}
.ctl option{background:#1a2160;color:#fff}
.tbtn{display:inline-flex;align-items:center;gap:4px}.tbtn .ic{margin:0;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}.tbtn:hover .ic{transform:rotate(25deg) scale(1.15)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
html{transition:background-color .4s}
.hero h1{animation:rise .8s .1s both}.hero p{animation:rise .8s .25s both}.hero .row,.hero>div>div:last-child{animation:rise .8s .4s both}
.pill .ic,.tag .ic{animation:fadeIn .6s both}
.stats b{transition:transform .3s}.stats div:hover b{transform:scale(1.12)}
aside.side button .ic{margin-inline-end:8px;transition:transform .3s}aside.side button:hover .ic,aside.side button.on .ic{transform:scale(1.2)}
.badge{transition:transform .25s}.badge:hover{transform:scale(1.08)}
input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(111,120,255,.25);transition:box-shadow .2s,border-color .2s}
.file{animation:pop .3s both}.ok{animation:pop .4s both}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.ck{font-weight:400!important;display:flex;gap:6px;align-items:center;margin:0}.ck input{width:auto}
.form h2.sh{margin:14px 0 10px;font-size:18px;color:var(--p);border-bottom:1px solid var(--bd);padding-bottom:6px}
.tm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.dl{display:grid;grid-template-columns:minmax(140px,230px) 1fr;gap:8px 16px;margin-top:10px}.dl b{color:var(--mu)}
.pl{background:none;border:0;color:#fff;text-decoration:underline;cursor:pointer;padding:0 8px;font-size:14px}
@media(max-width:900px){.tm,.dl{grid-template-columns:1fr}}
</style>
</head>

privacy(){const P=[['١. المعلومات التي نقوم بجمعها','1. Information we collect',['البيانات الشخصية: الاسم والبريد الإلكتروني ورقم الهاتف والصفة الأكاديمية أو الوظيفية.','بيانات الابتكارات والتحديات: الوصف الفني والملفات المرفقة وبيانات الملكية الفكرية (إن وجدت).','بيانات التصفح: عنوان IP ونوع المتصفح والصفحات التي تمت زيارتها لتحسين تجربة الاستخدام.'],['Personal data: name, email, phone number and academic or professional title.','Innovation and challenge data: technical descriptions, attached files and IP details, if any.','Browsing data: IP address, browser type and pages visited, used to improve the experience.']],

['٣. حماية البيانات ومشاركتها','3. Data protection and sharing',['البيانات والمشاريع المسجلة تعتبر سرية. لا نقوم ببيع أو تأجير بياناتك لأطراف خارجية.','قد تتم مشاركة المعلومات الأساسية فقط، وبموافقتك المسبقة، مع لجان التقييم الأكاديمية أو المستثمرين والجهات المعنية بهدف تفعيل الشراكات وحل التحديات.','نطبّق إجراءات تقنية وتنظيمية مناسبة لحماية قواعد بيانات المنصة من الوصول غير المصرح به.'],['Registered data and projects are treated as confidential. We do not sell or rent your data to third parties.','Only basic information may be shared, with your prior consent, with academic evaluation committees, investors or relevant bodies to enable partnerships and solve challenges.','We apply appropriate technical and organizational measures to protect the platform’s databases from unauthorized access.']]];

asub(){const rows=[...D.inn.map(x=>[x,'inn']),...D.ch.map(x=>[x,'ch'])];return`<h1>${L('Submissions','الطلبات')}</h1>${filters()}${table([L('Type','النوع'),L('Title','العنوان'),L('Category','الفئة'),L('Status','الحالة'),''],rows.filter(([x])=>match(x)).map(([x,k])=>[k==='inn'?L('Innovation','ابتكار'):L('Challenge','تحدٍّ'),P2(x.t),cat(x),bd(x.s),`<button class="btn o" data-a="go:adet${k}:${x.id}">${L('Manage','إدارة')}</button>`]))}`},
adetinn(){return detail(inn(S.id),'inn',true)},adetch(){return detail(ch(S.id),'ch',true)},
ausers(){const R2=[L('Researcher','باحث'),L('Company','شركة'),L('Viewer / Judge','مشاهد / محكّم')];return`<h1>${L('Users','المستخدمون')}</h1>${table([L('Name','الاسم'),L('Email','البريد'),L('Role','الدور')],D.users.map(u=>[P2([u[0],u[1]]),u[2],R2[u[3]]]))}`},
aviewer(){return`<h1>${L('Create Viewer / Judge account','إنشاء حساب مشاهد / محكّم')}</h1>${S.done?`<div class="ok" role="status">${L('Account added to the prototype list.','تمت إضافة الحساب إلى قائمة النموذج.')}</div><button class="btn" data-a="go:ausers">${L('View users','عرض المستخدمين')}</button>`:`<div class="form">${fld('n',L('Full name','الاسم الكامل'),{req:1})+fld('em',L('Email','البريد الإلكتروني'),{type:'email',req:1})+fld('pw',L('Temporary password','كلمة مرور مؤقتة'),{type:'password',req:1})}<div class="w"><button class="btn" data-a="mkv">${L('Create account','إنشاء الحساب')}</button></div></div>`}`},
aforms(){const k=S.tab==='ch'?'ch':'inn';return`<h1>${L('Form configuration','إعداد النماذج')}</h1><p class="mu">${L('Add custom fields (single-line text or choice). Fixed fields from the scope cannot be removed.','أضف حقولاً مخصصة (نص قصير أو اختيار). لا يمكن حذف الحقول الأساسية.')}</p><div class="row"><button class="btn ${k==='inn'?'':'o'}" data-a="tab:inn">${L('Innovation form','نموذج الابتكار')}</button><button class="btn ${k==='ch'?'':'o'}" data-a="tab:ch">${L('Challenge form','نموذج التحدي')}</button></div><div class="two" style="margin-top:16px"><div><div class="form" style="grid-template-columns:1fr">${fld('lbl',L('Field label','اسم الحقل'))}${fld('typ',L('Field type','نوع الحقل'),{type:'select',opts:[L('Single-line text','نص قصير'),L('Choice','اختيار')],vals:['text','choice']})}${fld('opt',L('Choices (comma separated)','الخيارات (مفصولة بفواصل)'))}<button class="btn" data-a="addf:${k}">${L('Add field','إضافة الحقل')}</button></div></div><div class="pub"><b>${L('Live preview of custom fields','معاينة الحقول المخصصة')}</b><div style="margin-top:12px">${D.cfg[k].length?D.cfg[k].map(c=>`<div class="f"><label>${P2(c.l)}</label>${c.t==='choice'?`<select>${c.o.split(',').map(o=>`<option>${esc(o)}</option>`).join('')}</select>`:'<input>'}</div>`).join(''):`<span class="mu">${L('No custom fields yet.','لا توجد حقول مخصصة بعد.')}</span>`}</div></div></div>`},
amatch(){return`<h1>${L('Potential matches','المطابقات المحتملة')}</h1>${table([L('Innovation','الابتكار'),L('Challenge','التحدي'),L('Recorded by','سجّلها'),''],D.m.map(x=>[P2(inn(x.i).t),P2(ch(x.c).t),x.by==='v1'?L('Judge Tarek Mansour','المحكّم طارق منصور'):L('Judge Heba Ali','المحكّمة هبة علي'),`<button class="btn o" data-a="go:mdet:${x.id}">${L('Open with notes','فتح مع الملاحظات')}</button>`]))}`}};

function detail(x,k,admin){const sc=k==='inn'?IDF:MP,dec=k==='inn'?DEC_I:DEC_C,v=x.v||{};
const rows=[...sc.flatMap(q=>q[1]),...dec].filter(f=>!f[6]).map(f=>[tok(f[1]),fv(f,v)]);
if(k==='inn')[1,2,3].forEach(n=>{const r=['n','a','r','e'].map(c=>v['tm'+n+c]).filter(Boolean);if(r.length)rows.push([L('Team member ','عضو الفريق ')+n,r.map(esc).join(' — ')])});
Object.keys(v).filter(q=>q.startsWith('cf_')&&v[q]).forEach(q=>rows.push([esc(q.slice(3)),esc(v[q])]));
const shown=rows.filter(r=>r[1]);
return`<button class="btn o" data-a="go:${admin?'asub':k==='inn'?'rdash':'cdash'}">${L('Back','رجوع')}</button><h1 style="margin-top:12px">${P2(x.t)}</h1><div class="row"><span class="pill">${cat(x)}</span>${bd(x.s)}</div>${stepper(x.s)}
<div class="pub" style="margin:16px 0"><span class="tag" style="color:var(--ok)">${k==='inn'?L('Public brief','الملخص العام'):L('Public description','الوصف العام')}</span><p>${esc(brief(x))}</p></div>
<div class="priv"><span class="tag" style="color:var(--no)">${L('Private details — owner and Admin only','تفاصيل خاصة — للمالك والإدارة فقط')}</span><div class="dl">${shown.map(r=>`<b>${r[0]}</b><span>${r[1]}</span>`).join('')}</div><div style="margin-top:12px"><b class="mu">${L('Attachments','المرفقات')}:</b> ${(x.files||[]).map(n=>`<span class="file">${esc(n)}</span>`).join('')||`<span class="mu sm">${L('None','لا يوجد')}</span>`}</div></div>
${admin?`<div class="card" style="margin-top:16px"><b>${L('Change status (Admin only)','تغيير الحالة (للإدارة فقط)')}</b><div class="row">${x.s===0?`<button class="btn" data-a="st:${k}:${x.id}:1">${L('Move to Under Review','نقل إلى قيد المراجعة')}</button>`:x.s===1?`<button class="btn" data-a="st:${k}:${x.id}:2">${L('Accept','قبول')}</button><button class="btn g" data-a="st:${k}:${x.id}:3">${L('Reject','رفض')}</button>`:`<span class="mu">${L('Final status. No further transitions.','حالة نهائية. لا توجد انتقالات أخرى.')}</span>`}</div></div>`:`<p class="mu sm">${L('Only Admin can change the status.','الإدارة وحدها تغيّر الحالة.')}</p>`}`}

/* shell */
function R(){const pub=['home','inns','chs','innd','chd','login','reg','privacy'].includes(S.page);const nav=NAV[S.role];
if(!S.theme){try{S.theme=localStorage.getItem('luxTheme')}catch(e){}if(!S.theme)S.theme=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}document.documentElement.dataset.theme=S.theme;document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
let body=PG[S.page]();
const content=S.role==='visitor'||pub?body:`<div class="shell"><aside class="side"><h4>${P2(ROLES[S.role])}</h4>${nav.map(n=>`<button class="${S.page===n[0]||(n[0]==='asub'&&S.page.startsWith('adet'))?'on':''}" data-a="go:${n[0]}">${ic(/dash|home/.test(n[0])?'grid':/user|viewer/.test(n[0])?'users':/match/.test(n[0])?'link':/form/.test(n[0])?'list':/ch|company/.test(n[0])&&!/inn/.test(n[0])?'target':'bulb')}${L(n[1],n[2])}</button>`).join('')}</aside><main>${body}</main></div>`;
const root=document.getElementById('root');const keep=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.f;
root.innerHTML=`<div class="proto">${L('Design prototype with sample data. Nothing is stored securely or permanently.','نموذج تصميمي ببيانات تجريبية. لا يتم حفظ أي بيانات بشكل آمن أو دائم.')}</div>
<header class="top"><div class="bar"><button class="brand" data-a="exit"><img src="${LOGO}" alt=""><span><b>${L('Innovative Luxor University','جامعة الأقصر الابتكارية')}</b><small>${L('Luxor University','جامعة الأقصر')}</small></span></button><nav class="pubnav" aria-label="${L('Public','العامة')}"><button data-a="go:home">${ic('home')}${L('Home','الرئيسية')}</button><button data-a="go:inns">${ic('bulb')}${L('Innovations','الابتكارات')}</button><button data-a="go:chs">${ic('target')}${L('Challenges','التحديات')}</button>${S.role!=='visitor'?`<button data-a="role:${S.role}">${ic('grid')}${L('My workspace','مساحة عملي')}</button>`:''}${S.role==='visitor'?`<button data-a="go:login">${ic('login')}${L('Log in','دخول')}</button><button data-a="go:reg">${ic('plus')}${L('Register','تسجيل')}</button>`:`<button data-a="exit">${L('Log out','خروج')}</button>`}</nav><span class="sp"></span><div class="ctl"><select data-role aria-label="${L('Preview role','معاينة الدور')}">${Object.keys(ROLES).map(r=>`<option value="${r}" ${S.role===r?'selected':''}>${L('View as: ','عرض كـ: ')}${P2(ROLES[r])}</option>`).join('')}</select><button class="tbtn" data-a="theme" aria-label="${S.theme==='dark'?L('Switch to light mode','التبديل إلى الوضع الفاتح'):L('Switch to dark mode','التبديل إلى الوضع الغامق')}">${ic(S.theme==='dark'?'sun':'moon')}${S.theme==='dark'?L('Light','فاتح'):L('Dark','غامق')}</button><button class="tbtn" data-a="lang">${ic('globe')}${S.lang==='ar'?'English':'العربية'}</button></div></div></header>
${content}${pub||S.role==='visitor'?`<footer>${L('© 2026 Luxor University. Prototype for design review.','© 2026 جامعة الأقصر. نموذج للمراجعة التصميمية.')} <button class="pl" data-a="go:privacy">${L('Privacy policy','سياسة الخصوصية')}</button></footer>`:''}
${S.toast?`<div class="toast" role="status">${S.toast}</div>`:''}
${S.modal?`<div class="mask"><div class="dlg" role="dialog" aria-modal="true"><h3>${L('Confirm status change','تأكيد تغيير الحالة')}</h3><p>${P2(S.modal.x.t)}: ${bd(S.modal.x.s)} → ${bd(S.modal.to)}</p><div class="row"><button class="btn" data-a="ok">${L('Confirm','تأكيد')}</button><button class="btn o" data-a="no">${L('Cancel','إلغاء')}</button></div></div></div>`:''}`;
root.classList.toggle('nav',!!S.nav);S.nav=0;
if(keep){const e=root.querySelector(`[data-f="${keep}"]`);if(e){e.focus();try{e.setSelectionRange(e.value.length,e.value.length)}catch(_){}}}}

/* events */
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;const p=a.dataset.a.split(':');const A=p[0];
 if(A==='go')go(p[1],p[2]);
 else if(A==='theme'){S.theme=S.theme==='dark'?'light':'dark';try{localStorage.setItem('luxTheme',S.theme)}catch(e){}R()}
 else if(A==='lang'){S.lang=S.lang==='ar'?'en':'ar';R()}
 else if(A==='exit'){S.role='visitor';go('home')}
 else if(A==='role'){S.role=p[1];go({researcher:'rdash',company:'cdash',viewer:'vdash',admin:'adash'}[p[1]])}
 else if(A==='tab'){S.tab=p[1];S.cat='';S.q='';R()}
 else if(A==='rt'){S.f={type:p[1]};R()}
 else if(A==='reg'){const f=S.f,t=f.type||'researcher',e2={},need=L('This field is required.','هذا الحقل مطلوب.');(t==='researcher'?['n','em','pw','fa','de']:['o','n','em','pw']).forEach(k=>{if(!(f[k]||'').trim())e2[k]=need});S.err=e2;if(!Object.keys(e2).length)S.done=true;R()}
 else if(A==='sub')submit(p[1]);
 else if(A==='st'){const x=p[1]==='inn'?inn(p[2]):ch(p[2]);S.modal={x,to:+p[3]};R()}
 else if(A==='ok'){S.modal.x.s=S.modal.to;S.modal=null;toast(L('Status updated (preview only).','تم تحديث الحالة (معاينة فقط).'))}
 else if(A==='no'){S.modal=null;R()}
 else if(A==='rec'){D.m.push({id:'m'+(D.m.length+1),i:S.sel.i,c:S.sel.c,by:'v1',n:S.f.note||'—',d:'2026-10-24'});S.sel={i:'',c:''};S.f={};go('vmatch');toast(L('Potential match recorded.','تم تسجيل المطابقة المحتملة.'))}
 else if(A==='mkv'){const f=S.f,e2={},need=L('This field is required.','هذا الحقل مطلوب.');['n','em','pw'].forEach(k=>{if(!(f[k]||'').trim())e2[k]=need});S.err=e2;if(!Object.keys(e2).length){D.users.push([f.n,f.n,f.em,2]);S.done=true}R()}
 else if(A==='addf'){const f=S.f;if(!(f.lbl||'').trim()){S.err={lbl:L('Enter a field label.','أدخل اسم الحقل.')};R();return}D.cfg[p[1]].push({l:[f.lbl,f.lbl],k:f.lbl,t:f.typ||'text',o:f.opt||'Option 1,Option 2'});S.f={};S.err={};R();toast(L('Field added to preview.','أُضيف الحقل إلى المعاينة.'))}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.f){S.f[t.dataset.f]=t.value;if(t.dataset.f==='pb'){const w=document.getElementById('wc');if(w)w.textContent=wc(t.value)}}
 if(t.hasAttribute('data-q')){S.q=t.value;upd()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.f){S.f[t.dataset.f]=t.value;if(t.tagName==='SELECT')R()}
 if(t.dataset.m){const a=S.f[t.dataset.m]||[];S.f[t.dataset.m]=t.checked?[...a,t.value]:a.filter(x=>x!==t.value);R()}
 if(t.hasAttribute('data-ack')){S.f.ack=t.checked;if(t.checked)delete S.err.ack}
 if(t.hasAttribute('data-cat')){S.cat=t.value;upd()}
 if(t.hasAttribute('data-role')){S.role=t.value;const m={visitor:'home',researcher:'rdash',company:'cdash',viewer:'vdash',admin:'adash'};go(m[t.value])}
 if(t.dataset.sel){S.sel[t.dataset.sel]=t.value;R()}
 if(t.hasAttribute('data-files')){S.files=[...t.files].map(f=>f.name);R()}});
function upd(){const pg=S.page;let h;
 if(pg==='inns')h=list(pubI(),'inn','innd');else if(pg==='chs')h=list(pubC(),'ch','chd');
 else if(pg==='vdash')h=list(S.tab==='inn'?pubI():pubC(),S.tab,S.tab==='inn'?'vinn':'vch');
 else if(pg==='asub'){R();const q=document.querySelector('[data-q]');q.focus();q.setSelectionRange(q.value.length,q.value.length);return}
 const r=document.getElementById('res');if(r&&h)r.innerHTML=h}
R();
</script>
</body>
